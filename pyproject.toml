[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]

name = "asistarcalibration"
version = "1.0.0"
description = "General ASI imager calibration"
readme = "README.md"
requires-python = ">= 3.9"
license = { file = "LICENSE" }
authors = [
    { name='Leslie Lamarche', email='leslie.lamarche@sri.com' },
    { name='Asti Bhatt', email='asti.bhatt@sri.com' },
    { name='Todd Valentic', email='todd.valentic@gmail.com' }
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent"
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "skyfield",
    "pymap3d",
    "h5py",
    "importlib_resources>1.3; python_version < '3.10'"
]

[project.optional-dependencies]
#test = [	-- no testing set up yet
#    'pytest',
#    'pyfakefs',
#    'pylint',
#    'black'
#]
devel = [
    'build'
]

[project.urls]
repository="https://github.com/ljlamarche/asistarcalibration"

#[project.scripts]

[tool.setuptools.packages.find]
where = ["src"]

#[tool.setuptools.dynamic]
#version = { attr = "asistarcalibration.__version__"}

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib"
]

